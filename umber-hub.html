<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1A12">
<title>Umber Hub</title>
<style>
:root{color-scheme:light;--bg1:#F4ECE3;--bg2:#E2CDB8;--glass:rgba(255,255,255,.55);--gb:rgba(90,58,42,.16);--tx:#2A1A12;--t2:#6B4A38;--ac:#8A5230;--on:#fff;--o1:rgba(196,138,94,.45);--o2:rgba(138,82,48,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#2A1A12;--bg2:#4A2F21;--glass:rgba(255,255,255,.09);--gb:rgba(255,255,255,.2);--tx:#F4ECE3;--t2:#D8BFA8;--ac:#C48A5E;--on:#2A1A12;--o1:rgba(196,138,94,.4);--o2:rgba(120,70,40,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#2A1A12;--bg2:#4A2F21;--glass:rgba(255,255,255,.09);--gb:rgba(255,255,255,.2);--tx:#F4ECE3;--t2:#D8BFA8;--ac:#C48A5E;--on:#2A1A12;--o1:rgba(196,138,94,.4);--o2:rgba(120,70,40,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--tx);background-color:var(--bg1);background-image:radial-gradient(circle at 15% 0,var(--o1),transparent 50%),radial-gradient(circle at 95% 65%,var(--o2),transparent 45%),linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 2px}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--t2);font-size:15px}
label.sub{display:block;margin-top:4px}
.g{background:var(--glass);border:1px solid var(--gb);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:600;font-size:16px;font-family:inherit;background:var(--ac);color:var(--on);width:100%;cursor:pointer}
.btn.s{background:var(--glass);color:var(--tx);border:1px solid var(--gb)}
.box{padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:14px;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:14px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.big{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;font-size:30px}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--gb);background:var(--glass);color:var(--tx);font-size:14px;font-family:inherit;cursor:pointer;text-decoration:none}
.chip.on{background:var(--ac);color:var(--on);border-color:transparent}
.c{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.qt{display:flex;align-items:center;gap:10px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
nav .g{display:flex;border-radius:28px}
nav button{background:none;border:0;color:var(--t2);font-size:14px;font-family:inherit;padding:14px 6px;flex:1;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--gb);background:var(--glass);color:var(--tx);font-size:16px;font-family:inherit;margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));padding:12px 18px;z-index:30;border-radius:999px;font-size:14px}
</style></head>
<body>
<div id="app"><main class="c sub">Loading…</main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAnVP6uzJFpVijpPRTVIAfJMsaXIN1kds4",authDomain:"umber-8b64b.firebaseapp.com",projectId:"umber-8b64b",appId:"1:688241909538:web:a9bcd233fe32e3855bcf7b"};
// Your own Google email: it unlocks the Platform tab where you register stores. Must match firestore.rules.
const PLAT="matshulker.original@gmail.com";
const auth=getAuth(initializeApp(cfg)),db=getFirestore();
const $=s=>document.querySelector(s),V={},B={},roles=["owner","manager","developer","admin"],nextS={new:"preparing",preparing:"ready",ready:"served"},lbl={new:"Start",preparing:"Mark ready",ready:"Mark served"};
let U=null,M=null,RS=null,tab="",P=[],O=[],T=[],RL=[],un=[],ar=false,rem=false,tbl="",draft={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>"$"+Number(v).toFixed(2),isP=()=>U&&U.email===PLAT.toLowerCase(),has=(...r)=>M&&r.includes(M.role);
const seats=r=>[T.filter(s=>s.role===r&&s.active!==false).length,((RS&&RS.seats)||{})[r]||0];
function toast(m){const t=document.createElement("div");t.className="toast g";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const err=e=>toast("Couldn’t complete that: "+(e.code||"error"));
const tabs=()=>{const t=[];if(has("owner","manager","admin"))t.push(["orders","Orders"]);if(M)t.push(["menu","Menu"]);if(has("owner","manager"))t.push(["team","Team"]);if(isP())t.push(["plat","Platform"]);return t};

function listen(){
if(M){const b=["restaurants",M.rid];
un.push(onSnapshot(doc(db,...b),s=>{RS=s.exists()?{id:s.id,...s.data()}:null;const h=$("#hn");if(h&&RS)h.textContent=RS.name;redraw("team")},err),
onSnapshot(collection(db,...b,"products"),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));redraw("menu")},err),
onSnapshot(query(collection(db,"staff"),where("rid","==",M.rid)),s=>{T=s.docs.map(d=>({id:d.id,...d.data()}));redraw("team")},err));
if(has("owner","manager","admin"))un.push(onSnapshot(query(collection(db,...b,"orders"),where("open","==",true)),s=>{O=s.docs.map(d=>({id:d.id,...d.data()}));redraw("orders")},err))}
if(isP())un.push(onSnapshot(collection(db,"restaurants"),s=>{RL=s.docs.map(d=>({id:d.id,...d.data()}));redraw("plat")},err))}

V.orders=()=>{const av=P.filter(p=>!p.deleted&&p.available!==false).sort((a,b)=>a.name.localeCompare(b.name));
return `<h2>New order</h2><div class="g box"><input id="tb" placeholder="Table or name" value="${esc(tbl)}">${av.length?av.map(p=>`<div class="ln"><span>${esc(p.name)}</span><span class="qt"><button class="chip" data-q="${p.id}" data-d="-1">−</button><b>${draft[p.id]||0}</b><button class="chip" data-q="${p.id}" data-d="1">+</button></span></div>`).join(""):`<p class="sub">No available products yet.</p>`}<button class="btn" id="send" style="margin-top:10px">Send to kitchen</button></div>
<h2 style="margin-top:18px">Open orders</h2>${O.length?O.slice().sort((a,b)=>(a.t?.seconds||0)-(b.t?.seconds||0)).map(o=>`<div class="g box"><div class="ln"><b>${esc(o.table)}</b><span class="chip ${o.status==="ready"?"on":""}">${o.status}</span></div><div class="sub">${o.items.map(i=>i.q+" × "+esc(i.n)).join(", ")}</div><button class="btn s" data-s="${o.id}" style="margin-top:10px">${lbl[o.status]}</button></div>`).join(""):`<div class="g box sub">No open orders.</div>`}`};
B.orders=()=>{$("#tb").oninput=e=>tbl=e.target.value;
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const k=b.dataset.q;draft[k]=Math.max(0,(draft[k]||0)+Number(b.dataset.d));redraw()});
$("#send").onclick=()=>{const it=P.filter(p=>draft[p.id]>0&&!p.deleted).map(p=>({n:p.name,q:draft[p.id]}));if(!it.length){toast("Add at least one item");return}
addDoc(collection(db,"restaurants",M.rid,"orders"),{items:it,table:tbl.trim()||"No table",status:"new",open:true,by:U.email,t:serverTimestamp()}).then(()=>{draft={};tbl="";redraw();toast("Sent to kitchen")}).catch(err)};
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const o=O.find(x=>x.id===b.dataset.s),n=nextS[o.status];updateDoc(doc(db,"restaurants",M.rid,"orders",o.id),{status:n,open:n!=="served"}).catch(err)})};

V.menu=()=>{const ed=has("owner","manager","developer"),act=P.filter(p=>!p.deleted).sort((a,b)=>a.name.localeCompare(b.name)),rm=P.filter(p=>p.deleted),st=p=>p.available===false?"Sold out":"Available";
return `<h2>Menu</h2>${ed?`<div class="g box"><input id="pn" placeholder="Product name"><input id="pp" type="number" step="0.01" min="0" placeholder="Price"><input id="pd" placeholder="Short note (optional)"><button class="btn" id="pa">Add product</button></div>`:`<p class="sub">Check what’s available before taking an order.</p>`}
${act.length?act.map(p=>`<div class="g row"><div style="flex:1;min-width:140px"><b>${esc(p.name)}</b> <span class="sub">${money(p.price)}</span>${p.note?`<div class="sub">${esc(p.note)}</div>`:""}</div>${ed?`<button class="chip ${p.available===false?"":"on"}" data-a="${p.id}">${st(p)}</button><button class="chip" data-e="${p.id}">Edit</button><button class="chip" data-r="${p.id}">Remove</button>`:`<span class="chip ${p.available===false?"":"on"}">${st(p)}</span>`}</div>`).join(""):`<div class="g box sub">No products yet.</div>`}
${ed&&rm.length?`<button class="chip" id="sr">${rem?"Hide":"Show"} removed (${rm.length})</button>${rem?rm.map(p=>`<div class="g row" style="margin-top:10px"><div style="flex:1" class="sub">${esc(p.name)}</div><button class="chip" data-u="${p.id}">Restore</button></div>`).join(""):""}`:""}`};
B.menu=()=>{const up=(id,d)=>updateDoc(doc(db,"restaurants",M.rid,"products",id),{...d,by:U.email}).catch(err),all=(s,f)=>document.querySelectorAll(s).forEach(f);
if($("#pa"))$("#pa").onclick=()=>{const n=$("#pn").value.trim(),pr=parseFloat($("#pp").value);if(!n||isNaN(pr)||pr<0){toast("Add a name and a price");return}
addDoc(collection(db,"restaurants",M.rid,"products"),{name:n,price:pr,note:$("#pd").value.trim(),available:true,deleted:false,by:U.email,t:serverTimestamp()}).then(()=>toast("Product added")).catch(err)};
all("[data-a]",b=>b.onclick=()=>{const p=P.find(x=>x.id===b.dataset.a);up(p.id,{available:p.available===false})});
all("[data-e]",b=>b.onclick=()=>{const p=P.find(x=>x.id===b.dataset.e),n=prompt("Product name",p.name);if(n===null)return;const pr=parseFloat(prompt("Price",p.price));if(!n.trim()||isNaN(pr))return;up(p.id,{name:n.trim(),price:pr})});
all("[data-r]",b=>b.onclick=()=>up(b.dataset.r,{deleted:true}));
all("[data-u]",b=>b.onclick=()=>up(b.dataset.u,{deleted:false}));
if($("#sr"))$("#sr").onclick=()=>{rem=!rem;redraw()}};

V.team=()=>`<h2>Team</h2><div class="g box">${roles.map(r=>{const[u,l]=seats(r);return `<div class="ln"><span>${r[0].toUpperCase()+r.slice(1)} accounts</span><b>${u} of ${l}</b></div>`}).join("")}<p class="sub" style="margin:10px 0 0">Visitors who stay 5 minutes or more will show here once Umber records visits.</p></div>
${has("owner")?`<div class="g box"><h2>Add an account</h2><input id="te" type="email" placeholder="Google email"><input id="tn" placeholder="Name"><select id="tr">${roles.filter(r=>r!=="owner").map(r=>`<option>${r}</option>`).join("")}</select><button class="btn" id="ta">Add account</button></div>`:""}
${T.slice().sort((a,b)=>roles.indexOf(a.role)-roles.indexOf(b.role)).map(s=>`<div class="g row"><div class="av">${esc((s.name||s.id)[0]||"?").toUpperCase()}</div><div style="flex:1;min-width:140px"><b>${esc(s.name||s.id)}</b><div class="sub">${esc(s.id)}</div></div><span class="chip ${s.active===false?"":"on"}">${s.active===false?"inactive":s.role}</span><a class="chip" href="mailto:${esc(s.id)}">Contact</a>${has("owner")&&s.role!=="owner"?`<button class="chip" data-k="${esc(s.id)}">${s.active===false?"Reactivate":"Deactivate"}</button>`:""}</div>`).join("")}`;
B.team=()=>{if($("#ta"))$("#ta").onclick=()=>{const e=$("#te").value.trim().toLowerCase(),n=$("#tn").value.trim(),r=$("#tr").value,[u,l]=seats(r);
if(!/^\S+@\S+\.\S+$/.test(e)||!n){toast("Add a Google email and a name");return}if(u>=l){toast("No "+r+" seats left");return}
setDoc(doc(db,"staff",e),{rid:M.rid,role:r,name:n,email:e,active:true,by:U.email}).then(()=>toast("Account added")).catch(err)};
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const s=T.find(x=>x.id===b.dataset.k),on=s.active===false,[u,l]=seats(s.role);if(on&&u>=l){toast("No "+s.role+" seats left");return}updateDoc(doc(db,"staff",s.id),{active:on}).catch(err)})};

V.plat=()=>`<h2>Register a store</h2><div class="g box"><input id="sn" placeholder="Store name"><input id="se" type="email" placeholder="Owner’s Google email">${roles.map(r=>`<label class="sub">${r[0].toUpperCase()+r.slice(1)} seats</label><input id="s_${r}" type="number" min="0" value="${r==="owner"?1:r==="manager"?2:r==="developer"?1:3}">`).join("")}<button class="btn" id="sg">Register store</button></div>
<h2 style="margin-top:18px">Stores</h2>${RL.length?RL.map(r=>`<div class="g box"><b>${esc(r.name)}</b><div class="sub">${esc(r.id)}</div><div class="sub">${roles.map(k=>k+" "+((r.seats||{})[k]||0)).join(", ")}</div></div>`).join(""):`<div class="g box sub">No stores yet.</div>`}`;
B.plat=()=>{$("#sg").onclick=()=>{const n=$("#sn").value.trim(),e=$("#se").value.trim().toLowerCase();if(!n||!/^\S+@\S+\.\S+$/.test(e)){toast("Add a store name and owner email");return}
const id=n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),sd={};roles.forEach(r=>sd[r]=Math.max(0,parseInt($("#s_"+r).value)||0));
setDoc(doc(db,"restaurants",id),{name:n,seats:sd,createdBy:U.email},{merge:true}).then(()=>setDoc(doc(db,"staff",e),{rid:id,role:"owner",name:e.split("@")[0],email:e,active:true,by:U.email},{merge:true})).then(()=>toast("Store registered")).catch(err)}};

function redraw(t){if(!U||!$("#v"))return;if(t&&t!==tab&&!(t==="menu"&&tab==="orders"))return;$("#v").innerHTML=V[tab]();B[tab]()}
function render(){const a=$("#app");
if(!U){a.innerHTML=`<main class="c"><div class="g box" style="text-align:center;padding:30px 22px"><div class="av big">U</div><h1>Umber Hub</h1><p class="sub">Run your menu, orders and team.</p><button class="btn" id="go" style="margin-top:18px">Continue with Google</button></div></main>`;$("#go").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>toast("Sign-in didn’t finish. Try again."));return}
const t=tabs();
if(!t.length){a.innerHTML=`<main class="c"><div class="g box"><h2>No store linked</h2><p class="sub">${esc(U.email)} isn’t registered with a store yet. Ask your Umber contact to add it.</p><button class="btn s" id="out">Sign out</button></div></main>`;$("#out").onclick=()=>signOut(auth);return}
if(!t.find(x=>x[0]===tab))tab=t[0][0];
a.innerHTML=`<main><div class="top"><div><h1 id="hn">${RS?esc(RS.name):"Umber Hub"}</h1><div class="sub">${esc(U.name)}, ${M?M.role:"platform"}</div></div><button class="chip" id="out">Sign out</button></div><div id="v"></div></main><nav><div class="g">${t.map(([k,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")}</div></nav>`;
$("#out").onclick=()=>signOut(auth);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
redraw()}

onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];P=[];O=[];T=[];RL=[];M=null;RS=null;U=u?{email:(u.email||"").toLowerCase(),name:u.displayName||"Guest"}:null;
if(U){try{const s=await getDoc(doc(db,"staff",U.email));if(s.exists()&&s.data().active!==false)M=s.data()}catch(e){err(e)}listen()}
ar=true;tab="";render()});
</script></body></html>
