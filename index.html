<style>

h1{font-size:30px;letter-spacing:-.02em;margin:6px 0 2px}

.sub{color:var(--t2);font-size:15px}

.pick.wide{aspect-ratio:8/3}.pick.sq{width:84px;height:84px;flex:none}.pick.av2{width:110px;height:110px;border-radius:32px;margin:0 auto 12px}

.map{position:relative;aspect-ratio:1;border-radius:24px;background:var(--glass);border:1px solid var(--gb);overflow:hidden;touch-action:none}.map.rect{aspect-ratio:4/3}
.tb{position:absolute;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:1px solid var(--gb);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;font-size:13px;touch-action:none;cursor:grab}
.tb small{color:var(--t2);font-size:11px}.tb.off{opacity:.4}
.sh{max-height:90vh;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}.cal small{text-align:center;color:var(--t2)}
.day{aspect-ratio:1;border-radius:14px;border:1px solid var(--gb);background:var(--glass);color:var(--t2);font-family:inherit;font-size:15px;opacity:.45}.day.ok{background:var(--ac);color:var(--on);opacity:1;border-color:transparent}
</style></head>

const login=()=>`<main style="min-height:100vh;display:flex;flex-direction:column;justify-content:center"><div class="g" style="padding:30px 22px;text-align:center"><div class="av" style="width:76px;height:76px;border-radius:24px;margin:0 auto 16px;font-size:32px">U</div><h1>Umber</h1><p class="sub">Scan a QR, read the menu, book a table.</p><button class="btn" id="go" style="margin-top:20px">Continue with Google</button>${window.FB&&FB.ready?"":`<p class="sub" style="font-size:13px;margin-top:14px">Add your Firebase keys to index.html to enable sign-in.</p>`}</div></main>`;

views.scan=()=>`<h1>Hello, ${S.user.name.split(" ")[0]}</h1><p class="sub">Scan a table QR to open its menu.</p>
<div class="g vf" style="margin:16px 0"><video id="v" playsinline muted style="display:none"></video><span id="vh">Camera is off</span></div>
<button class="btn" id="cam">Start camera</button><p class="sub" id="sm" style="min-height:22px;margin:10px 2px"></p>
<h2>Enter a code</h2><div style="display:flex;gap:8px;margin:4px 0 18px"><input id="code" placeholder="For example aurora-cafe" autocapitalize="off" style="margin:0"><button class="btn s" id="gc" style="width:auto">Open</button></div>

bind.scan=()=>{const sm=m=>$("#sm").textContent=m;bindOpen();

try{cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=$("#v");v.srcObject=cam;v.style.display="block";$("#vh").style.display="none";await v.play();$("#cam").textContent="Stop camera";const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});

<h2 style="margin-top:18px">Restaurants</h2>${pos?`<div class="chips">${[["all","All"],["near","Near, under 10 km"],["far","Far"]].map(f=>`<button class="chip ${fl===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("")}</div>`:`<div class="g" style="padding:16px;margin:6px 0 14px"><p class="sub" style="margin:0 0 12px">Share your location to sort restaurants by distance. Demo restaurants are placed around you.</p><button class="btn" id="loc">Use my location</button></div>`}
${L.map(r=>`<div class="g row" data-o="${r.id}">${av(r)}<div style="flex:1"><b>${esc(r.n)}</b><div class="sub">${esc(r.c||"")}</div><div class="sub">${pos&&r.km!=null?dist(r.km):esc(r.a||"")}</div></div><button class="chip on" data-b="${r.id}">Book</button></div>`).join("")}`};

let rz=null;const WB={},WF={},BZ={},RZ={};

function calV(r,X,bz){const m=rz.mo,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),t0=iso(new Date()),mx=iso(new Date(Date.now()+90*864e5));let c="";for(let i=0;i<first;i++)c+="<i></i>";
for(let d=1;d<=n;d++){const ds=y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),ok=ds>=t0&&ds<=mx&&dayOk(ds,X,bz);c+=`<button class="day ${ok?"ok":""}" ${ok?`data-d="${ds}"`:"disabled"}>${d}</button>`}
return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Book at ${esc(r.n)}</h2><button class="chip" data-z="x">Close</button></div>${mineN(r.id)>=2?`<p class="sub">You already have 2 upcoming reservations here. Cancel one to book again.</p>`:""}<div style="display:flex;justify-content:space-between;align-items:center"><b>${m.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><span><button class="chip" data-z="p">Prev</button> <button class="chip" data-z="n">Next</button></span></div><div class="cal">${"SMTWTFS".split("").map(x=>`<small>${x}</small>`).join("")}${c}</div><div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><span>Guests</span><span><button class="chip" data-z="g-">−</button> <b>${rz.g}</b> <button class="chip" data-z="g+">+</button></span></div><label style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><span>Children coming</span><input type="checkbox" id="kd" ${rz.kids?"checked":""} style="width:auto;margin:0"></label><p class="sub" style="font-size:13px">Highlighted days have free tables for your group.</p>`}
function mapV(X,bz){const fls=X.fl.slice().sort((a,b)=>(a.order||0)-(b.order||0));if(!fls.find(f=>f.id===rz.fl))rz.fl=fls[0]?fls[0].id:"";const f=fls.find(x=>x.id===rz.fl)||{};
return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="chip" data-z="b">Back</button><b>${rz.date}</b><button class="chip" data-z="x">Close</button></div>${fls.length>1?`<div class="chips">${fls.map(x=>`<button class="chip ${x.id===rz.fl?"on":""}" data-f="${x.id}">${esc(x.name)}</button>`).join("")}</div>`:""}<div class="map ${f.shape==="rect"?"rect":""}">${X.tb.filter(t=>t.floor===rz.fl).map(t=>{const ok=fits(t)&&free(t,rz.date,bz).length>0;return `<button class="tb ${ok?"":"off"}" data-t="${t.id}" style="left:${t.x==null?50:t.x}%;top:${t.y==null?50:t.y}%"><b>${esc(t.name)}</b><small>${t.seats} seats</small></button>`}).join("")}</div><p class="sub" style="font-size:13px">Tap a table to see its details.</p>`}
function bindRz(X,bz){const o=$("#rz");o.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{const z=b.dataset.z,m=rz.mo;if(z==="x"){rz=null;o.remove();return}if(z==="b")rz.date="";if(z==="p")rz.mo=new Date(m.getFullYear(),m.getMonth()-1,1);if(z==="n")rz.mo=new Date(m.getFullYear(),m.getMonth()+1,1);if(z==="g+")rz.g=Math.min(12,rz.g+1);if(z==="g-")rz.g=Math.max(1,rz.g-1);draw()});
o.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(mineN(rz.id)>=2){toast("You already have 2 reservations here");return}rz.date=b.dataset.d;draw()});
o.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{rz.fl=b.dataset.f;draw()});
o.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>tableSheet(X.tb.find(t=>t.id===b.dataset.t),bz));
const k=$("#kd");if(k)k.onchange=()=>{rz.kids=k.checked;draw()}}
function tableSheet(t,bz){const w=free(t,rz.date,bz),o=document.createElement("div");o.className="ov";o.style.zIndex=30;const opts=(a,b)=>{let h="";for(let i=a;i<=b;i++)h+=`<option>${i}</option>`;return h};
o.innerHTML=`<div class="sh"><h2>${esc(t.name)}</h2><p class="sub">${t.seats} seats${t.kids?", children welcome":""}</p>${!fits(t)?`<p class="sub">This table doesn’t fit ${rz.g} guest${rz.g>1?"s":""}${rz.kids&&!t.kids?" with children":""}.</p>`:w.length?`<p class="sub">Free: ${w.map(([a,b])=>a+":00 to "+b+":00").join(", ")}</p><label class="sub">Free window</label><select id="wz">${w.map((x,i)=>`<option value="${i}">${x[0]}:00 to ${x[1]}:00</option>`).join("")}</select><label class="sub">From (hour)</label><select id="fa"></select><label class="sub">Until (hour)</label><select id="fe"></select><button class="btn" id="rb">Reserve</button>`:`<p class="sub">No free time on this day.</p>`}</div>`;
document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};
if($("#rb")){const fill=()=>{const a=+$("#fa").value,b=w[+$("#wz").value][1];$("#fe").innerHTML=opts(a+1,Math.min(b,a+3))},sel=()=>{const x=w[+$("#wz").value];$("#fa").innerHTML=opts(x[0],x[1]-1);fill()};$("#wz").onchange=sel;$("#fa").onchange=fill;sel();$("#rb").onclick=()=>book(t,+$("#fa").value,+$("#fe").value,o)}}
function book(t,a,b,o){const rid=rz.id,u=S.user.uid,up=upc(rid),id=[1,2].map(n=>u+"_"+n).find(i=>!up.find(x=>x._id===i));if(!id){toast("You already have 2 reservations here");return}
const w=FS.writeBatch(FS.db),B=["restaurants",rid],d={uid:u,tid:t.id,tn:t.name,date:rz.date,start:a,end:b,g:rz.g};
w.set(FS.doc(FS.db,...B,"busy",id),d);w.set(FS.doc(FS.db,...B,"bookings",id),{...d,kids:rz.kids,name:S.user.name,photo:S.user.photo||"",t:FS.serverTimestamp()});
w.commit().then(()=>{o.remove();const z=$("#rz");if(z)z.remove();rz=null;toast("Reserved "+t.name);render()}).catch(()=>toast("Couldn’t reserve. Try another time."))}

views.hist=()=>`<h1>Visited</h1><p class="sub">Restaurants you’ve opened with Umber.</p><div style="margin-top:14px">${S.vis.length?S.vis.map(v=>{const r=R.find(x=>x.id===v.id);if(!r)return"";return `<div class="g row" data-o="${r.id}">${av(r)}<div style="flex:1"><b>${esc(r.n)}</b><div class="sub">${new Date(v.t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</div></div><span class="sub">View menu</span></div>`}).join(""):`<div class="g sub" style="padding:22px;text-align:center">Nothing yet. Scan a QR to open your first menu.</div>`}</div>`;
bind.hist=bindOpen;

views.me=()=>`<h1>Account</h1><div class="g" style="padding:18px;margin:14px 0 20px"><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${S.user.photo?`<img class="av" src="${S.user.photo}" style="width:56px;height:56px;border-radius:18px;object-fit:cover">`:`<div class="av" style="width:56px;height:56px;border-radius:18px">${esc(S.user.name[0]||"?")}</div>`}<div><b>${esc(S.user.name)}</b><div class="sub">${esc(S.user.email)}</div></div></div><button class="btn" id="pe">Edit profile</button></div>
<h2>Appearance</h2><div class="chips">${["auto","light","dark"].map(t=>`<button class="chip ${S.th===t?"on":""}" data-th="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
<h2>Distance</h2><div class="chips"><button class="chip ${S.mi?"":"on"}" data-u="km">Kilometres</button><button class="chip ${S.mi?"on":""}" data-u="mi">Miles</button></div>
<h2>Payments</h2><div class="g sub" style="padding:14px;margin:6px 0 20px">No payment methods needed right now.</div>
<button class="btn s" id="so">Sign out</button>`;
function profileBind(){$("#pe").onclick=()=>{let ph;const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sh"><h2>Edit profile</h2><label class="pick av2">${S.user.photo?`<img src="${S.user.photo}">`:`<div class="ph">+</div>`}<span>Change</span><input id="pf" type="file" accept="image/*" hidden></label><label class="sub">Name</label><input id="pn" value="${esc(S.user.name)}"><button class="btn" id="ps">Save</button></div>`;document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};
$("#pf").onchange=async e=>{try{ph=await pic(e.target.files[0],192,192);$("#pf").parentNode.querySelector("img,.ph").outerHTML=`<img src="${ph}">`}catch(x){toast("That image didn’t load")}};
$("#ps").onclick=()=>{const d={name:$("#pn").value.trim()||S.user.name};if(ph)d.photo=ph;Object.assign(S.user,d);o.remove();render();if(window.FS)FS.setDoc(FS.doc(FS.db,"customers",S.user.uid),d,{merge:true}).then(()=>toast("Profile saved")).catch(()=>toast("Couldn’t save your profile"))}}}
bind.me=()=>{profileBind();document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{S.th=b.dataset.th;save();render()});
document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{S.mi=b.dataset.u==="mi";save();render()});
$("#so").onclick=()=>FB.out()};

function render(){stopCam();theme();const a=$("#app");
if(!ar){a.innerHTML=`<main style="min-height:100vh;display:grid;place-items:center" class="sub">Loading…</main>`;return}
if(!S.user){a.innerHTML=login();$("#go").onclick=async()=>{if(!window.FB||!FB.ready){toast("Add your Firebase keys first");return}try{await FB.in()}catch(e){toast("Sign-in didn’t finish. Try again.")}};return}
if(cur){a.innerHTML=menu(cur);bindMenu();return}
a.innerHTML=`<main>${views[tab]()}</main><nav><div class="g">${[["scan","Scan"],["book","Book"],["hist","Visited"],["me","Account"]].map(([k,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${ic(k)}${l}</button>`).join("")}</div></nav>`;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
bind[tab]()}
function crew(rid,sid){const k=rid+sid;if(!window.FS||crew.k===k)return;crew.k=k;setTimeout(()=>crew.k="",4000);
FS.getDoc(FS.doc(FS.db,"restaurants",rid,"crew",sid)).then(d=>{if(!d.exists()){toast("That team member isn’t available");return}const c=d.data(),st=R.find(x=>x.id===rid),L={owner:"Owner",manager:"Manager",developer:"Team",admin:"Server"},o=document.createElement("div");o.className="ov";o.style.zIndex=30;
o.innerHTML=`<div class="sh" style="text-align:center">${c.photo?`<img src="${c.photo}" style="width:110px;height:110px;border-radius:32px;object-fit:cover">`:`<div class="av" style="width:110px;height:110px;border-radius:32px;margin:0 auto;font-size:36px">${esc((c.name||"?")[0]).toUpperCase()}</div>`}<h2 style="margin:12px 0 0">${esc(c.name)}</h2><div class="sub">${L[c.role]||"Team"}${st?" at "+esc(st.n):""}</div><button class="btn s" id="cx" style="margin-top:16px">Close</button></div>`;
document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};$("#cx").onclick=()=>o.remove()}).catch(()=>toast("Couldn’t load that profile"))}
function hashOpen(){const w=location.hash.match(/^#w:([^:]+):(.+)$/);if(w){if(S.user)crew(w[1],w[2]);return}const r=find(location.hash);if(r){S.user?openMenu(r.id):pend=r.id}}
addEventListener("hashchange",hashOpen);
addEventListener("umber-user",e=>{const u=e.detail;ar=true;if(u){let d={};try{d=JSON.parse(localStorage.getItem(K+u.uid)||"{}")}catch(x){}S={vis:[],bk:[],mi:false,th:"auto",...d,user:u}}else{S.user=null;cur=null}startR();render();hashOpen();if(u&&window.FS)FS.getDoc(FS.doc(FS.db,"customers",u.uid)).then(c=>{if(c.exists()){Object.assign(S.user,c.data());render()}}).catch(()=>{})});
setTimeout(()=>{if(!ar){ar=true;render()}},6000);
render();hashOpen();
</script></body></html>
